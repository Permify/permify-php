---
name: Deploy

on:
  workflow_dispatch:
    inputs:
      command:
        type: choice
        options:
          - publish  # publish to packagist
          - release  # release to svn

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: /usr/bin/bash -l -e -o pipefail {0}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          java-package: jre

      - name: install savant
        run: |
          curl -O https://repository.savantbuild.org/org/savantbuild/savant-core/2.0.0/savant-2.0.0.tar.gz
          tar xzvf savant-2.0.0.tar.gz
          savant-2.0.0/bin/sb --version
          SAVANT_PATH=$(realpath -s "./savant-2.0.0/bin")
          echo "${SAVANT_PATH}" >> $GITHUB_PATH
          mkdir -p ~/.savant/plugins
          cat << EOF > ~/.savant/plugins/org.savantbuild.plugin.java.properties
          21=${JAVA_HOME}
          EOF

      - name: update savant properties file
        run: |
          echo "packagistUsername=${{ env.PERMIFY_PACKAGIST_USERNAME }}" >> ~/.savant/config.properties
          echo "packagistAPIToken=${{ env.PERMIFY_PACKAGIST_TOKEN }}" >> ~/.savant/config.properties

      - name: release to svn
        if: inputs.command == 'release'
        run: sb release

      - name: publish to packagist
        if: inputs.command == 'publish'
        run: sb publish
